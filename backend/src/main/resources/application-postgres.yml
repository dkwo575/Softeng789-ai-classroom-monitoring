spring:
  flyway:
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  autoconfigure:
    exclude: []
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/classroom_monitoring}
    username: ${POSTGRES_USER:classroom_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    properties:
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

webcam:
  sharing-enabled: ${WEBCAM_SHARING_ENABLED:false}

live-video:
  enabled: ${LIVE_VIDEO_ENABLED:false}

cv:
  enabled: ${CV_ENABLED:false}
  service-url: ${CV_SERVICE_URL:http://127.0.0.1:8000}
  service-key: ${CV_SERVICE_KEY:}
  encryption-key: ${CV_ENCRYPTION_KEY:}

ai:
  service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:15s}
    ingest-key: ${AI_INGEST_KEY:}
    adapter-key: ${AI_ADAPTER_KEY:}
  face-enrollment:
    provider: ${FACE_ENROLLMENT_PROVIDER:http}
  student-recognition:
    provider: ${STUDENT_RECOGNITION_PROVIDER:demo}
  feedback-summary:
    provider: ${FEEDBACK_SUMMARY_PROVIDER:demo}
    read-timeout: ${FEEDBACK_SUMMARY_READ_TIMEOUT:90s}
  payment-message:
    provider: ${PAYMENT_MESSAGE_PROVIDER:demo}
    read-timeout: ${PAYMENT_MESSAGE_READ_TIMEOUT:90s}

app:
  auth:
    login-attempts:
      max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
      failure-window: ${AUTH_LOGIN_FAILURE_WINDOW:15m}
      block-duration: ${AUTH_LOGIN_BLOCK_DURATION:15m}
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    face-enrollment-dir: ${FACE_ENROLLMENT_DIR:../data/face-enrollment}
    payment-evidence-dir: ${PAYMENT_EVIDENCE_DIR:../data/payment-evidence}
